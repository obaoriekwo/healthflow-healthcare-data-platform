name: Terraform CI

# Checks the Azure infrastructure code on every change: formatting, provider download and
# validation. No Azure credentials are used or needed; nothing is deployed from here.
on:
  push:
    branches: [main]
    paths: ["infrastructure/terraform/**", ".github/workflows/terraform-ci.yml"]
  pull_request:
    paths: ["infrastructure/terraform/**", ".github/workflows/terraform-ci.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
