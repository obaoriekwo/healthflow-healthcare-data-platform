[project]
name = "healthflow"
version = "0.1.0"
description = "HealthFlow: healthcare data integration and analytics platform (portfolio project)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_site.py" = ["E501"]  # HTML template lines
